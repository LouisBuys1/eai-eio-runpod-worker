name: RunPod Worker Image

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "workers/runpod-sulphur/**"
      - ".github/workflows/runpod-worker-image.yml"

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Publish RunPod Sulphur worker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: workers/runpod-sulphur
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/louisbuys1/eai-eio-runpod-sulphur:latest
            ghcr.io/louisbuys1/eai-eio-runpod-sulphur:${{ github.sha }}
