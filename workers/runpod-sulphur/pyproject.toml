[project]
name = "eai-eio-runpod-sulphur-worker"
version = "0.1.0"
description = "RunPod Serverless worker for EAI-EIO Sulphur/LTX video generation"
requires-python = ">=3.10"
dependencies = [
  "accelerate>=1.2.0",
  "boto3>=1.35.0",
  "diffusers>=0.38.0",
  "huggingface-hub>=0.27.0",
  "imageio[ffmpeg]>=2.36.0",
  "pillow>=11.0.0",
  "requests>=2.32.0",
  "runpod>=1.7.0",
  "safetensors==0.8.0rc0",
  "torch==2.9.1",
  "transformers>=4.51.0",
]

[project.scripts]
eai-eio-runpod-sulphur-worker = "eai_eio_runpod_sulphur_worker.worker:main"

[tool.pyright]
pythonVersion = "3.10"
typeCheckingMode = "strict"
include = ["src", "tests"]
